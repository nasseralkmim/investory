<svg width="100" height="110" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
  <title>Investory Logo</title>

  <!-- Background -->
  <rect width="100" height="110" fill="#f8f8f8" />

  <!-- Title Text -->
  <text x="50" y="12" font-family="monospace" font-size="12" fill="#333" text-anchor="middle">investory</text>

  <!-- Terminal Window Border -->
  <rect x="5" y="20" width="90" height="85" fill="#2d2d2d" rx="3" ry="3">
      <title>Terminal Window</title>
  </rect>
  <rect x="5" y="20" width="90" height="15" fill="#444" rx="3" ry="3"/>
  <circle cx="15" cy="27.5" r="3" fill="#ff5f56"/> <!-- Close -->
  <circle cx="25" cy="27.5" r="3" fill="#ffbd2e"/> <!-- Minimize -->
  <circle cx="35" cy="27.5" r="3" fill="#27c93f"/> <!-- Maximize -->
  <rect x="8" y="38" width="84" height="64" fill="#f8f8f8" /> <!-- Inner content area -->


  <!-- Python Blue Bar -->
  <rect x="15" y="70" width="20" height="28" fill="#306998">
    <title>Python Blue</title>
  </rect>
  <!-- Python Yellow Bar -->
  <rect x="40" y="50" width="20" height="48" fill="#FFD43B">
    <title>Python Yellow</title>
  </rect>
  <!-- Growth Bar (Green) -->
  <rect x="65" y="40" width="20" height="58" fill="#4CAF50">
    <title>Growth</title>
  </rect>

  <!-- Performance Line -->
  <polyline points="15,85 40,65 65,45 85,40" fill="none" stroke="#e67e22" stroke-width="2.5">
      <title>Performance Trend</title>
  </polyline>

  <!-- Base line -->
  <line x1="10" y1="98" x2="90" y2="98" stroke="#555" stroke-width="2"/>

</svg>
