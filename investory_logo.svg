<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <title>Investory Logo</title>

  <!-- Background -->
  <rect width="100" height="100" fill="#f8f8f8" />

  <!-- Python Blue Bar -->
  <rect x="15" y="55" width="20" height="30" fill="#306998">
    <title>Python Blue</title>
  </rect>
  <!-- Python Yellow Bar -->
  <rect x="40" y="35" width="20" height="50" fill="#FFD43B">
    <title>Python Yellow</title>
  </rect>
  <!-- Growth Bar (Green) -->
  <rect x="65" y="15" width="20" height="70" fill="#4CAF50">
    <title>Growth</title>
  </rect>

  <!-- Terminal/Ledger Element (Subtle prompt) -->
  <text x="5" y="95" font-family="monospace" font-size="10" fill="#333">>_</text>

  <!-- Base line -->
  <line x1="10" y1="85" x2="90" y2="85" stroke="#555" stroke-width="2"/>

</svg>
