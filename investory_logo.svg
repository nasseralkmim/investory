<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <title>Investory Logo</title>

  <!-- Background -->
  <rect width="100" height="100" fill="#f0f0f0" />

  <!-- Simple Bar Chart representing growth -->
  <rect x="15" y="60" width="20" height="25" fill="#4CAF50">
    <title>Bar 1</title>
  </rect>
  <rect x="40" y="40" width="20" height="45" fill="#8BC34A">
    <title>Bar 2</title>
  </rect>
  <rect x="65" y="20" width="20" height="65" fill="#CDDC39">
    <title>Bar 3</title>
  </rect>

  <!-- Base line -->
  <line x1="10" y1="85" x2="90" y2="85" stroke="#333" stroke-width="2"/>

  <!-- Optional: Text "Investory" -->
  <!-- <text x="50" y="95" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Investory</text> -->
</svg>
